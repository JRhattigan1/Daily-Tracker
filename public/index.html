<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Daily Tracker</title>
<meta name="theme-color" content="#fdfcf9">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Tracker">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="app.css">
</head>
<body>
<main class="page">

  <header class="top">
    <div class="titleblock">
      <div class="eyebrow">Daily tracker</div>
      <div class="titlerow">
        <button id="prev" class="nav" type="button" aria-label="Previous month">
          <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <h1><span id="month"></span> <span id="year" class="yr"></span></h1>
        <button id="next" class="nav" type="button" aria-label="Next month">
          <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M9 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <button id="todayBtn" class="pill" type="button" hidden>This month</button>
      </div>
    </div>
    <div class="topright">
      <label class="field focus"><span>Focus this month</span><input id="focus" type="text" autocomplete="off" enterkeyhint="done"></label>
      <div class="meta">
        <span id="status" class="status" aria-live="polite"></span>
        <button id="themeBtn" class="pill" type="button"></button>
      </div>
    </div>
  </header>

  <!-- Portrait and narrow screens: days run down, tasks across, plots on tabs -->
  <section id="mview" class="mview" aria-label="Tracker">
    <nav class="mtabs" role="tablist" aria-label="View">
      <button type="button" role="tab" data-tab="tasks">Tasks</button>
      <button type="button" role="tab" data-tab="sleep">Sleep</button>
      <button type="button" role="tab" data-tab="steps">Steps</button>
      <button type="button" role="tab" data-tab="mood">Mood</button>
    </nav>
    <div id="mhead" class="mhead"></div>
    <div id="mbody" class="mbody"></div>
  </section>

  <section class="grid" aria-label="Daily tasks">
    <div id="dayhead" class="track dayhead"></div>
    <div id="tasks" class="tasks"></div>
  </section>

  <section class="plot" aria-label="Sleep">
    <div class="ptitle">
      <div><h2>Sleep</h2><p>hours a night</p></div>
      <div id="sleepAxis" class="axis" aria-hidden="true"></div>
    </div>
    <svg id="sleepSvg" class="psvg" role="group" aria-label="Sleep plot. Tap a day at the right height, or drag across several days."></svg>
  </section>

  <section class="plot" aria-label="Steps">
    <div class="ptitle">
      <div><h2>Steps</h2><p>per day</p></div>
      <div id="stepsAxis" class="axis" aria-hidden="true"></div>
    </div>
    <svg id="stepsSvg" class="psvg" role="group" aria-label="Steps plot. Tap a day at the right height, or drag across several days."></svg>
  </section>

  <section class="plot" aria-label="Mood">
    <div class="ptitle">
      <div><h2>Mood</h2><p>how the day felt</p></div>
      <div id="moodAxis" class="axis" aria-hidden="true"></div>
    </div>
    <svg id="moodSvg" class="psvg" role="group" aria-label="Mood plot. Tap a day at the right height, or drag across several days."></svg>
  </section>

  <div id="dayaxis" class="track dayaxis" aria-hidden="true"></div>

  <footer class="foot">
    <div class="stat"><span>Days all done</span><b id="statAll">0</b></div>
    <div class="stat"><span>Best streak</span><b id="statStreak">0</b></div>
    <div class="stat"><span>Avg sleep</span><b id="statSleep">-</b></div>
    <div class="stat"><span>Avg steps</span><b id="statSteps">-</b></div>
    <div class="stat"><span>Avg mood</span><b id="statMood">-</b></div>
    <label class="field notes"><span>Notes</span><input id="notes" type="text" autocomplete="off" enterkeyhint="done"></label>
  </footer>

</main>

<div id="tsheet" class="sched tsheet" role="dialog" aria-labelledby="tsTitle" hidden>
  <div id="tsTitle" class="sched-title">Task</div>
  <label class="field tsname"><span>Name</span><input id="tsName" type="text" autocomplete="off" enterkeyhint="done" placeholder="e.g. Brush teeth"></label>
  <div class="tsrow">
    <span>Times per day</span>
    <div class="stepper">
      <button type="button" id="tsLess" aria-label="Fewer times per day">&minus;</button>
      <b id="tsTarget">1</b>
      <button type="button" id="tsMore" aria-label="More times per day">+</button>
    </div>
  </div>
  <div class="tsrow"><span>Due on</span></div>
  <div class="sched-days" id="tsDays">
    <button type="button" data-wd="1">Mon</button>
    <button type="button" data-wd="2">Tue</button>
    <button type="button" data-wd="3">Wed</button>
    <button type="button" data-wd="4">Thu</button>
    <button type="button" data-wd="5">Fri</button>
    <button type="button" data-wd="6">Sat</button>
    <button type="button" data-wd="0">Sun</button>
  </div>
  <div class="sched-actions">
    <button type="button" class="pill" data-preset="all">Every day</button>
    <button type="button" class="pill" data-preset="weekdays">Weekdays</button>
    <button type="button" id="tsDone" class="pill strong">Done</button>
  </div>
  <button type="button" id="tsRemove" class="linkbtn">Remove this task</button>
</div>

<div id="sched" class="sched" role="dialog" aria-labelledby="schedTitle" hidden>
  <div id="schedTitle" class="sched-title"></div>
  <div class="sched-days">
    <button type="button" data-wd="1">Mon</button>
    <button type="button" data-wd="2">Tue</button>
    <button type="button" data-wd="3">Wed</button>
    <button type="button" data-wd="4">Thu</button>
    <button type="button" data-wd="5">Fri</button>
    <button type="button" data-wd="6">Sat</button>
    <button type="button" data-wd="0">Sun</button>
  </div>
  <div class="sched-actions">
    <button type="button" class="pill" data-preset="all">Every day</button>
    <button type="button" class="pill" data-preset="weekdays">Weekdays</button>
    <button type="button" id="schedDone" class="pill strong">Done</button>
  </div>
  <p class="sched-note">Rest days are skipped: they don&#39;t count against totals or streaks, and chains carry straight through them.</p>
</div>
<script src="app.js"></script>
</body>
</html>
