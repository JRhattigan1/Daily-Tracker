name: daily-tracker
services:
  daily-tracker:
    image: python:3.12-alpine
    container_name: daily-tracker
    restart: unless-stopped
    working_dir: /app
    command: ["python", "server.py"]
    environment:
      - DATA_DIR=/app/data
      - PORT=8080
      - TZ=Europe/London
      - PYTHONUNBUFFERED=1
    ports:
      - "8090:8080"
    volumes:
      - /DATA/AppData/daily-tracker:/app
